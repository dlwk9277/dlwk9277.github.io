<!DOCTYPE html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Jie</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0C0C0D">
  <!-- This page can be shown at ANY address, so it uses no relative links
       and keeps its styles inline. HOME is set below. -->
  <style>
    :root { --bg:#0C0C0D; --text:#F2F2EE; --muted:#A1A19C; --accent:#AFC6EE; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 20px;
           background:var(--bg); color:var(--text);
           font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 520px; }
    .tape { height:10px; width:10px; border-radius:2px; margin-bottom:28px; background:var(--accent);
            border-radius:2px; }
    h1 { font-size: clamp(2.2rem, 9vw, 3.2rem); line-height:1.05; margin:0 0 14px; letter-spacing:-.02em; }
    p { color: var(--muted); margin: 0 0 28px; }
    .actions { display:flex; flex-wrap:wrap; gap:14px 22px; align-items:center; }
    .btn { display:inline-flex; align-items:center; min-height:50px; padding:.7em 1.4em; border-radius:12px;
           background:var(--text); color:var(--bg); font-weight:800; text-decoration:none; }
    .btn:hover { background:#fff; }
    .link { font-weight:700; color:var(--text); text-decoration-color:var(--accent); text-decoration-thickness:2px; text-underline-offset:5px; }
    a:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <div class="tape" aria-hidden="true"></div>
    <h1>This page doesn't exist.</h1>
    <p>The link may be old or mistyped. Head back to the homepage, or message me and I'll help you find what you need.</p>
    <div class="actions">
      <a class="btn" id="home" href="/">Go to the homepage</a>
      <a class="link" href="https://wa.me/6592778104?text=Hi%20Jie%2C%20I%20saw%20your%20website.%20I'm%20interested%20in%20a%20website%20for%20my%20business." target="_blank" rel="noopener">WhatsApp Jie</a>
    </div>
  </main>
  <script>
    /* If the site lives at username.github.io/repo-name/, change HOME to "/repo-name/". */
    var HOME = "/";
    document.getElementById("home").href = HOME;
  </script>
</body>
</html>
